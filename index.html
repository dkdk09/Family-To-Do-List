<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f5f5f0;
            min-height: 100vh;
            padding: 20px;
            color: #000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #000;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #fff;
            border: 3px solid #000;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1em;
            font-weight: bold;
        }

        .card {
            background: #fff;
            border: 3px solid #000;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #000;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        input[type="text"],
        select {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em;
            font-weight: bold;
            background-color: #fff;
            color: #000;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            background: #000;
            color: #fff;
            border: 3px solid #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: bold;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translate(0px, 0px);
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .member-card {
            background: #fff;
            border: 3px solid #000;
            padding: 20px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .member-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
        }

        .member-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .member-tasks {
            list-style: none;
        }

        .member-tasks li {
            background: #fff;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .member-tasks li:last-child {
            margin-bottom: 0;
        }

        .task-text {
            flex: 1;
        }

        .task-text.urgent-none {
            color: #000;
        }

        .task-text.urgent-mild {
            color: #ff9800;
        }

        .task-text.urgent-extreme {
            color: #d32f2f;
        }

        .task-action {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .task-btn {
            padding: 5px 10px;
            font-size: 0.85em;
            cursor: pointer;
            border: 2px solid #000;
            border-radius: 0;
            transition: all 0.1s;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .complete-btn {
            background: #4caf50;
            color: white;
            border-color: #2e7d32;
        }

        .complete-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px rgba(46, 125, 50, 0.3);
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            border-color: #b71c1c;
        }

        .delete-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px rgba(179, 28, 28, 0.3);
        }

        .no-tasks {
            color: #666;
            font-style: italic;
            padding: 10px;
            text-align: center;
        }

        .no-members {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 1em;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .form-group {
                flex-direction: column;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👨‍👩‍👧‍👦 Family To-Do List</h1>
            <p>Keep everyone on track with shared tasks</p>
        </div>

        <!-- Add Family Member Section -->
        <div class="card">
            <h2>Add Family Member</h2>
            <form id="addMemberForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="memberName" 
                        placeholder="Enter family member name" 
                        required
                    >
                    <button type="submit">Add Member</button>
                </div>
            </form>
        </div>

        <!-- Add Task Section -->
        <div class="card">
            <h2>Add Task</h2>
            <form id="addTaskForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="taskDescription" 
                        placeholder="Enter the task" 
                        required
                    >
                </div>
                <div class="form-group">
                    <select id="memberSelect" required>
                        <option value="">Select family member</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="urgencyLevel" required>
                        <option value="none">Not Urgent</option>
                        <option value="mild">Mildly Urgent</option>
                        <option value="extreme">Extremely Urgent</option>
                    </select>
                    <button type="submit">Add Task</button>
                </div>
            </form>
        </div>

        <!-- Family Members & Tasks Section -->
        <div class="card">
            <h2>Family Tasks</h2>
            <div id="membersContainer" class="members-grid">
                <div class="no-members">No family members yet. Add one above!</div>
            </div>
        </div>
    </div>

    <script>
        // This is where your Flask integration goes!
        // For now, here's the structure:

        // Handle Add Member Form
        document.getElementById('addMemberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('memberName').value;
            
            fetch('/add_member', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('memberName').value = '';
                    refreshMembers();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Handle Add Task Form
        document.getElementById('addTaskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const task = document.getElementById('taskDescription').value;
            const member = document.getElementById('memberSelect').value;
            const urgency = document.getElementById('urgencyLevel').value;
            
            fetch('/add_task', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({member: member, task: task, urgency: urgency})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('taskDescription').value = '';
                    refreshMembers();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Function to refresh members (call this after adding member/task)
        function refreshMembers() {
            fetch('/get_members')
            .then(response => response.json())
            .then(data => {
                displayMembers(data);
                updateMemberDropdown(data);
            })
            .catch(error => console.error('Error fetching members:', error));
        }

        // Update the member dropdown with current family members
        function updateMemberDropdown(membersData) {
            const select = document.getElementById('memberSelect');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">Select family member</option>';
            membersData.forEach(member => {
                const option = document.createElement('option');
                option.value = member.name;
                option.textContent = member.name;
                select.appendChild(option);
            });
            
            select.value = currentValue;
        }

        // Function to display members on page
        function displayMembers(membersData) {
            const container = document.getElementById('membersContainer');
            
            if (membersData.length === 0) {
                container.innerHTML = '<div class="no-members">No family members yet. Add one above!</div>';
                return;
            }

            container.innerHTML = membersData.map(member => `
                <div class="member-card">
                    <div class="member-name">${member.name}</div>
                    <ul class="member-tasks">
                        ${member.tasks && member.tasks.length > 0 
                            ? member.tasks.map((task, index) => {
                                // task can be a string or an object with {text, urgency}
                                const taskText = typeof task === 'string' ? task : task.text;
                                const urgency = typeof task === 'string' ? 'none' : (task.urgency || 'none');
                                const urgencyClass = `urgent-${urgency}`;
                                
                                return `
                                    <li>
                                        <span class="task-text ${urgencyClass}">${taskText}</span>
                                        <div class="task-action">
                                            <button class="task-btn complete-btn" data-member="${member.name}" data-taskindex="${index}">✓</button>
                                            <button class="task-btn delete-btn" data-member="${member.name}" data-taskindex="${index}">✕</button>
                                        </div>
                                    </li>
                                `;
                            }).join('')
                            : `<li class="no-tasks">No tasks assigned</li>`
                        }
                    </ul>
                </div>
            `).join('');

            // Add event listeners to buttons
            document.querySelectorAll('.complete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const memberName = this.getAttribute('data-member');
                    const taskIndex = this.getAttribute('data-taskindex');
                    deleteTask(memberName, taskIndex);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const memberName = this.getAttribute('data-member');
                    const taskIndex = this.getAttribute('data-taskindex');
                    deleteTask(memberName, taskIndex);
                });
            });
        }

        // Function to delete a task
        function deleteTask(memberName, taskIndex) {
            fetch('/delete_task', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({member: memberName, taskIndex: taskIndex})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    refreshMembers();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        // Load members on page load
        document.addEventListener('DOMContentLoaded', function() {
            refreshMembers();
        });
    </script>
</body>
</html>
